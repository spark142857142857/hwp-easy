[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-hwp"
version = "0.1.0"
description = "Explicit local Hancom document inspection, guarded editing, and export"
readme = "docs/development.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hancom = ["pywin32>=306; platform_system == 'Windows'"]
mcp = ["mcp>=1.26,<2"]
pdf = ["pypdf>=6,<7"]

[project.scripts]
one-hwp = "one_hwp.cli:main"
one-hwp-mcp = "one_hwp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["one_hwp*"]
