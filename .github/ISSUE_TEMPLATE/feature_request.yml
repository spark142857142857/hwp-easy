name: 기능 제안 / Feature request
description: 원하는 HWP 작업 흐름을 설명해 주세요.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 작업 / User task
      description: 어떤 작업에서 무엇이 불편한지 설명해 주세요. 개인 문서는 첨부하지 마세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작 / Proposed behavior
      description: 요청 예시와 결과를 설명해 주세요. 현재 지원 범위는 README에 있습니다.
    validations:
      required: true
