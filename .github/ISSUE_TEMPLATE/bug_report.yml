name: 버그 신고 / Bug report
description: 개인정보 없는 합성 재현으로 문제를 알려 주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        보안 문제는 Security → Report a vulnerability로 비공개 신고하세요.
        개인 HWP, 토큰·쿠키·암호·인증 코드, 서명된 링크는 올리지 마세요.
        저장소 공개와 플러그인 출시 상태는 별개입니다.
  - type: input
    id: version
    attributes:
      label: 버전 또는 커밋 / Version or commit
      description: 실행한 소스나 패키지의 버전입니다. 연결 ID나 인증 정보는 필요하지 않습니다.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 실행 경로 / Surface
      options:
        - 로컬 MCP / Local MCP
        - 원격 MCP / Remote MCP
        - 브라우저 업로드·보기 / Browser
        - 테스트·패키징 / Tests or packaging
        - 기타 / Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 최소 재현 / Reproduction
      description: 개인정보 없는 합성 입력과 실행 단계를 적어 주세요. 원본 문서를 첨부하지 마세요.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 동작과 실제 결과 / Expected and actual behavior
      description: 고정 오류 코드가 있으면 적고, 원문·파일 이름·민감한 화면은 제외하세요.
    validations:
      required: true
