name: Source checks

on:
  # Run at development milestones and before releases, rather than every commit.
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope (all or a focused table feature)
        type: choice
        default: all
        options: [all, table-flow, table-text, table-metrics, table-controls, table-floating, table-compact]

permissions:
  contents: read

jobs:
  regression:
    if: ${{ inputs.scope == 'all' }}
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Includes isolated preview workers for every changed candidate.
    # Complex suites run in local-complex on both platforms; avoid duplicating
    # them here so packaging, Python/MCP checks and cleanup fit this budget.
    # Large text remains in a separate job; individual request bounds stay fixed.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install source test dependencies
        run: python -m pip install ".[mcp,pdf,hancom,native]" PyYAML
      - name: Set up pinned WASM host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact engine runtime without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check document links and private/generated file exclusions
        run: node scripts/check-repository.mjs
      - name: Test real HWP WASM engine without Hancom
        run: npm run test:engine
      - name: Install exact browser guard test dependencies
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare browser guard with independent Python reader and canonical checks
        run: node probes/sites-runtime/scripts/check-python-guard.mjs
      - name: Verify local same-file edits, structural changes and isolated plugin runtime
        run: node --test --test-concurrency=2 tests/test_local_runner.mjs tests/test_local_structure.mjs tests/test_local_advanced.mjs tests/test_local_extended.mjs tests/test_local_pictures.mjs tests/test_local_text.mjs tests/test_local_table_format.mjs tests/test_local_batch.mjs tests/test_local_move.mjs tests/test_local_style.mjs tests/test_local_history.mjs tests/test_local_find.mjs
      - name: Node package local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Python archive local plugin
        run: python scripts/archive_local_plugin.py
      - name: Node check local plugin
        run: node scripts/check-local-plugin.mjs
      - name: Python check local structure
        run: python scripts/check-local-structure.py
      - name: Python check local advanced
        run: python scripts/check-local-advanced.py
      - name: Node check local pictures
        run: node scripts/check-local-pictures.mjs
      - name: Python check local pictures
        run: python scripts/check-local-pictures.py
      - name: Node check local text
        run: node scripts/check-local-text.mjs
      - name: Python check local text
        run: python scripts/check-local-text.py
      - name: Node check local table format
        run: node scripts/check-local-table-format.mjs
      - name: Python check local table format
        run: python scripts/check-local-table-format.py
      - name: Node check local batch
        run: node scripts/check-local-batch.mjs
      - name: Python check local batch
        run: python scripts/check-local-batch.py
      - name: Node check local move
        run: node scripts/check-local-move.mjs
      - name: Python check local move
        run: python scripts/check-local-move.py
      - name: Run regressions and real HWP MCP flows without Hancom
        env:
          HWP_EASY_NATIVE_TESTS: '1'
          HWP_EASY_RUNTIME_DIR: ${{ github.workspace }}
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Check explicit-only skill policy
        run: python -c "import pathlib,yaml; p=pathlib.Path('.agents/skills/one-hwp/agents/openai.yaml'); assert yaml.safe_load(p.read_text(encoding='utf-8'))['policy']['allow_implicit_invocation'] is False"
      - name: Build Python package only
        run: python -m pip wheel --no-deps --wheel-dir dist .

  agent-clients:
    if: ${{ inputs.scope == 'all' }}
    name: Claude Code and Cursor skills / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify explicit-only installation, shared engine and same-file recovery
        run: node --test tests/test_agent_skill_install.mjs
      - name: Node package local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Node package agent skills
        run: node scripts/package_agent_skills.mjs
      - name: Python archive agent skills
        run: python scripts/archive_agent_skills.py
      - name: Node check agent packages
        run: node scripts/check-agent-packages.mjs
      - name: Python check installed plugin
        run: python scripts/check-installed-plugin.py outputs/agent-client-check/claude-code
      - name: Python check installed plugin
        run: python scripts/check-installed-plugin.py outputs/agent-client-check/cursor

  local-complex:
    if: ${{ inputs.scope == 'all' }}
    name: Complex local objects / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Split packaged floating suites into local-floating; keep request limits.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 22
          - os: windows-latest
            timeout_minutes: 22
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Node Complex source regressions
        run: node --test --test-concurrency=2 tests/test_local_complex.mjs tests/test_local_complex_format.mjs tests/test_local_partial_read.mjs tests/test_local_complex_mapping.mjs tests/test_local_complex_picture.mjs tests/test_local_complex_table.mjs tests/test_local_complex_merged.mjs tests/test_local_complex_field.mjs tests/test_local_complex_group.mjs tests/test_local_freedom.mjs tests/test_local_reflow.mjs tests/test_local_placement.mjs tests/test_local_public_regressions.mjs tests/test_local_review_fixes.mjs tests/test_local_text_boxes.mjs tests/test_local_cell_text_box_layout.mjs tests/test_local_floating_areas.mjs tests/test_local_nested_floating.mjs tests/test_local_inline_cell_flow.mjs tests/test_local_cell_images.mjs tests/test_local_floating_transfer.mjs tests/test_local_preview.mjs
      - name: Node package local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Node complex
        run: node scripts/check-local-complex.mjs
      - name: Python complex
        run: python scripts/check-local-complex.py
      - name: Node complex format
        run: node scripts/check-local-complex-format.mjs
      - name: Python complex format
        run: python scripts/check-local-complex-format.py
      - name: Node complex editing
        run: node scripts/check-local-complex-editing.mjs
      - name: Python complex editing
        run: python scripts/check-local-complex-editing.py outputs/local-complex-editing-check
      - name: Node flexible tables
        run: node scripts/check-local-flexible-tables.mjs
      - name: Python flexible tables
        run: python scripts/check-local-flexible-tables.py outputs/local-flexible-tables-check
      - name: Node freedom
        run: node scripts/check-local-freedom.mjs
      - name: Python freedom
        run: python scripts/check-local-freedom.py
      - name: Node reflow
        run: node scripts/check-local-reflow.mjs
      - name: Python reflow
        run: python scripts/check-local-reflow.py
      - name: Node placement
        run: node scripts/check-local-placement.mjs
      - name: Python placement
        run: python scripts/check-local-placement.py

  local-floating:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'table-floating' }}
    name: Floating placement packages / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Node package local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Node floating areas
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-floating-areas.mjs
      - name: Python floating areas
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-floating-areas.py
      - name: Node nested floating
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-nested-floating.mjs
      - name: Python floating areas
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-floating-areas.py outputs/local-nested-floating
      - name: Node cell images
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-cell-images.mjs
      - name: Python floating areas
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-floating-areas.py outputs/local-cell-images
      - name: Node floating transfer
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-floating-transfer.mjs
      - name: Python floating areas
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-floating-areas.py outputs/local-floating-transfer
      - name: Node cell text boxes
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-cell-text-boxes.mjs
      - name: Python placement
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-placement.py outputs/local-cell-text-boxes
      - name: Node review fixes
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-review-fixes.mjs
      - name: Python review fixes
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-review-fixes.py outputs/local-review-fixes

      - name: Verify floating table-flow source regressions
        if: ${{ inputs.scope == 'all' }}
        run: node --test tests/test_local_table_floating.mjs
      - name: Verify independent floating table flow through package
        run: node scripts/check-local-table-floating.mjs
      - name: Independently verify floating table flow and recovery
        run: python scripts/check-local-table-floating.py

      - name: Verify all table source regressions during floating checks
        if: ${{ inputs.scope == 'table-floating' }}
        run: node --test --test-concurrency=2 tests/test_local_table_reflow.mjs tests/test_local_table_hosts.mjs tests/test_local_table_text_flow.mjs tests/test_local_table_text_metrics.mjs tests/test_local_table_controls.mjs tests/test_local_table_floating.mjs tests/test_local_table_compact.mjs

  local-table-flow:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'table-flow' }}
    name: Table growth and pagination / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 38 packaged cases plus source checks; include Windows cleanup time.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify root-tree growth, line splitting, atomic saves and recovery
        run: node --test tests/test_local_table_reflow.mjs tests/test_local_table_hosts.mjs
      - name: Node package local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Node check local table reflow
        run: node scripts/check-local-table-reflow.mjs
      - name: Python check local table reflow
        run: python scripts/check-local-table-reflow.py
      - name: Node check local table sync
        run: node scripts/check-local-table-sync.mjs
      - name: Python check local table sync
        run: python scripts/check-local-table-sync.py
      - name: Verify aligned cells and multiple host tables through the package
        run: node scripts/check-local-table-hosts.mjs
      - name: Independently verify host text, alignment, control order and recovery
        run: python scripts/check-local-table-sync.py outputs/local-table-hosts

  local-table-text:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'table-text' || inputs.scope == 'table-controls' || inputs.scope == 'table-compact' }}
    name: Table text and host controls / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify all table source regressions during scoped checks
        if: ${{ inputs.scope == 'table-text' }}
        run: node --test --test-concurrency=2 tests/test_local_table_reflow.mjs tests/test_local_table_hosts.mjs tests/test_local_table_text_flow.mjs
      - name: Verify all table source regressions during host control checks
        if: ${{ inputs.scope == 'table-controls' || inputs.scope == 'table-compact' }}
        run: node --test --test-concurrency=2 tests/test_local_table_reflow.mjs tests/test_local_table_hosts.mjs tests/test_local_table_text_flow.mjs tests/test_local_table_text_metrics.mjs tests/test_local_table_controls.mjs tests/test_local_table_floating.mjs tests/test_local_table_compact.mjs
      - name: Verify new text and host control regressions during full checks
        if: ${{ inputs.scope == 'all' }}
        run: node --test --test-concurrency=2 tests/test_local_table_text_flow.mjs tests/test_local_table_controls.mjs
      - name: Build isolated local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Verify interleaved text and multiple body roots through package
        if: ${{ inputs.scope != 'table-controls' && inputs.scope != 'table-floating' && inputs.scope != 'table-compact' }}
        run: node scripts/check-local-table-text-flow.mjs
      - name: Independently verify logical order, UTF-16 styles and recovery
        if: ${{ inputs.scope != 'table-controls' && inputs.scope != 'table-floating' && inputs.scope != 'table-compact' }}
        run: python scripts/check-local-table-text-flow.py

      - name: Verify fields and inline host objects through package
        if: ${{ inputs.scope == 'all' || inputs.scope == 'table-controls' }}
        run: node scripts/check-local-table-controls.mjs
      - name: Independently verify field ranges, inline objects and recovery
        if: ${{ inputs.scope == 'all' || inputs.scope == 'table-controls' }}
        run: python scripts/check-local-table-text-flow.py outputs/local-table-controls


      - name: Verify explicit content-fit rows through package
        if: ${{ inputs.scope == 'table-compact' }}
        run: node scripts/check-local-table-compact.mjs
      - name: Independently verify compact rows, non-target bytes and recovery
        if: ${{ inputs.scope == 'table-compact' }}
        run: python scripts/check-local-table-compact.py
      - name: Verify compact rows with floating space through package
        if: ${{ inputs.scope == 'table-compact' }}
        run: node scripts/check-local-table-floating.mjs outputs/local-table-compact-floating compact
      - name: Independently verify floating state and exact recovery
        if: ${{ inputs.scope == 'table-compact' }}
        run: python scripts/check-local-table-floating.py outputs/local-table-compact-floating

  local-table-metrics:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'table-metrics' }}
    name: Table text metrics / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify all table source regressions during scoped checks
        if: ${{ inputs.scope == 'table-metrics' }}
        run: node --test --test-concurrency=2 tests/test_local_table_reflow.mjs tests/test_local_table_hosts.mjs tests/test_local_table_text_flow.mjs tests/test_local_table_text_metrics.mjs
      - name: Verify styled text regressions during full checks
        if: ${{ inputs.scope == 'all' }}
        run: node --test --test-concurrency=2 tests/test_local_table_text_metrics.mjs tests/test_local_table_compact.mjs
      - name: Build isolated local plugin
        run: node scripts/package_local_plugin.mjs
      - name: Verify narrow and mixed-size Unicode text through package
        run: node scripts/check-local-table-metrics.mjs
      - name: Independently verify logical order, UTF-16 styles and recovery
        run: python scripts/check-local-table-text-flow.py outputs/local-table-metrics

      - name: Verify content-fit rows during full checks
        if: ${{ inputs.scope == 'all' }}
        run: node scripts/check-local-table-compact.mjs
      - name: Independently verify compact rows and recovery
        if: ${{ inputs.scope == 'all' }}
        run: python scripts/check-local-table-compact.py

  local-large-text:
    if: ${{ inputs.scope == 'all' }}
    name: Local large text / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Both checks finished near the old 12-minute boundary; allow runner cleanup.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python independent reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the independent HWP reader
        run: python -m pip install olefile==0.47
      - name: Set up pinned local host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder dependencies
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify full raw-run proofs and exact search ranges
        run: node --test tests/test_local_style.mjs tests/test_local_find.mjs
      - name: Build isolated local execution package
        run: node scripts/package_local_plugin.mjs
      - name: Verify long text, retained mixed styles and exact recovery
        run: node scripts/check-local-long-text.mjs
      - name: Python check local long text
        run: python scripts/check-local-long-text.py
      - name: Verify search pagination and same-file range edits
        run: node scripts/check-local-find.mjs
      - name: Python check local text
        run: python scripts/check-local-text.py outputs/local-find-20261011

  worker-runtime:
    if: ${{ inputs.scope == 'all' }}
    name: Synthetic Worker / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 10
          # The full Windows regression reached the final concurrency step
          # before the 10-minute job timeout. Keep a bounded runner allowance.
          - os: windows-latest
            timeout_minutes: 15
    defaults:
      run:
        working-directory: probes/sites-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Worker test host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact synthetic probe dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify independent byte record and container guards
        run: node --test tests/*.test.mjs
      - name: Build precompiled WASM module artifact
        run: node scripts/build.mjs
      - name: Verify synthetic HWP in actual workerd without Hancom
        run: node scripts/check-workerd.mjs
