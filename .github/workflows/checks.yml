name: Source checks

on:
  # Run at development milestones and before releases, rather than every commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Includes isolated preview workers for every changed candidate.
    # Complex suites run in local-complex on both platforms; avoid duplicating
    # them here so packaging, Python/MCP checks and cleanup fit this budget.
    # Large text remains in a separate job; individual request bounds stay fixed.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install source test dependencies
        run: python -m pip install ".[mcp,pdf,hancom,native]" PyYAML
      - name: Set up pinned WASM host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact engine runtime without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check document links and private/generated file exclusions
        run: node scripts/check-repository.mjs
      - name: Test real HWP WASM engine without Hancom
        run: npm run test:engine
      - name: Install exact browser guard test dependencies
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare browser guard with independent Python reader and canonical checks
        run: node probes/sites-runtime/scripts/check-python-guard.mjs
      - name: Verify local same-file edits, structural changes and isolated plugin runtime
        run: |
          node --test --test-concurrency=2 tests/test_local_runner.mjs tests/test_local_structure.mjs tests/test_local_advanced.mjs tests/test_local_extended.mjs tests/test_local_pictures.mjs tests/test_local_text.mjs tests/test_local_table_format.mjs tests/test_local_batch.mjs tests/test_local_move.mjs tests/test_local_style.mjs tests/test_local_history.mjs tests/test_local_find.mjs
          node scripts/package_local_plugin.mjs
          python scripts/archive_local_plugin.py
          node scripts/check-local-plugin.mjs
          python scripts/check-local-structure.py
          python scripts/check-local-advanced.py
          node scripts/check-local-pictures.mjs
          python scripts/check-local-pictures.py
          node scripts/check-local-text.mjs
          python scripts/check-local-text.py
          node scripts/check-local-table-format.mjs
          python scripts/check-local-table-format.py
          node scripts/check-local-batch.mjs
          python scripts/check-local-batch.py
          node scripts/check-local-move.mjs
          python scripts/check-local-move.py
      - name: Run regressions and real HWP MCP flows without Hancom
        env:
          HWP_EASY_NATIVE_TESTS: '1'
          HWP_EASY_RUNTIME_DIR: ${{ github.workspace }}
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Check explicit-only skill policy
        run: python -c "import pathlib,yaml; p=pathlib.Path('.agents/skills/one-hwp/agents/openai.yaml'); assert yaml.safe_load(p.read_text(encoding='utf-8'))['policy']['allow_implicit_invocation'] is False"
      - name: Build Python package only
        run: python -m pip wheel --no-deps --wheel-dir dist .

  agent-clients:
    name: Claude Code and Cursor skills / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify explicit-only installation, shared engine and same-file recovery
        run: |
          node --test tests/test_agent_skill_install.mjs
          node scripts/package_local_plugin.mjs
          node scripts/package_agent_skills.mjs
          python scripts/archive_agent_skills.py
          node scripts/check-agent-packages.mjs
          python scripts/check-installed-plugin.py outputs/agent-client-check/claude-code
          python scripts/check-installed-plugin.py outputs/agent-client-check/cursor

  local-complex:
    name: Complex local objects / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Expanded Windows checks passed but cleanup hit the 12-minute job limit.
    # Individual edit and preview worker limits remain unchanged.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 12
          - os: windows-latest
            timeout_minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up independent Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent OLE reader
        run: python -m pip install olefile==0.47
      - name: Verify fields, nested cells and grouped pictures in isolated runtime
        run: |
          node --test --test-concurrency=2 tests/test_local_complex.mjs tests/test_local_complex_format.mjs tests/test_local_partial_read.mjs tests/test_local_complex_mapping.mjs tests/test_local_complex_picture.mjs tests/test_local_complex_table.mjs tests/test_local_complex_merged.mjs tests/test_local_complex_field.mjs tests/test_local_complex_group.mjs tests/test_local_freedom.mjs tests/test_local_reflow.mjs tests/test_local_placement.mjs tests/test_local_public_regressions.mjs tests/test_local_review_fixes.mjs tests/test_local_text_boxes.mjs tests/test_local_cell_text_box_layout.mjs tests/test_local_floating_areas.mjs tests/test_local_nested_floating.mjs tests/test_local_preview.mjs
          node scripts/package_local_plugin.mjs
          node scripts/check-local-complex.mjs
          python scripts/check-local-complex.py
          node scripts/check-local-complex-format.mjs
          python scripts/check-local-complex-format.py
          node scripts/check-local-complex-editing.mjs
          python scripts/check-local-complex-editing.py outputs/local-complex-editing-check
          node scripts/check-local-flexible-tables.mjs
          python scripts/check-local-flexible-tables.py outputs/local-flexible-tables-check
          node scripts/check-local-freedom.mjs
          python scripts/check-local-freedom.py
          node scripts/check-local-reflow.mjs
          python scripts/check-local-reflow.py
          node scripts/check-local-placement.mjs
          python scripts/check-local-placement.py
          node scripts/check-local-floating-areas.mjs
          python scripts/check-local-floating-areas.py
          node scripts/check-local-nested-floating.mjs
          python scripts/check-local-floating-areas.py outputs/local-nested-floating
          node scripts/check-local-cell-text-boxes.mjs
          python scripts/check-local-placement.py outputs/local-cell-text-boxes
          node scripts/check-local-review-fixes.mjs
          python scripts/check-local-review-fixes.py outputs/local-review-fixes

  local-large-text:
    name: Local large text / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Both checks finished near the old 12-minute boundary; allow runner cleanup.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python independent reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the independent HWP reader
        run: python -m pip install olefile==0.47
      - name: Set up pinned local host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact engine runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact package builder dependencies
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify full raw-run proofs and exact search ranges
        run: node --test tests/test_local_style.mjs tests/test_local_find.mjs
      - name: Build isolated local execution package
        run: node scripts/package_local_plugin.mjs
      - name: Verify long text, retained mixed styles and exact recovery
        run: |
          node scripts/check-local-long-text.mjs
          python scripts/check-local-long-text.py
      - name: Verify search pagination and same-file range edits
        run: |
          node scripts/check-local-find.mjs
          python scripts/check-local-text.py outputs/local-find-20261011

  worker-runtime:
    name: Synthetic Worker / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 10
          # The full Windows regression reached the final concurrency step
          # before the 10-minute job timeout. Keep a bounded runner allowance.
          - os: windows-latest
            timeout_minutes: 15
    defaults:
      run:
        working-directory: probes/sites-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Worker test host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact synthetic probe dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify independent byte record and container guards
        run: node --test tests/*.test.mjs
      - name: Build precompiled WASM module artifact
        run: node scripts/build.mjs
      - name: Verify synthetic HWP in actual workerd without Hancom
        run: node scripts/check-workerd.mjs
      - name: Verify durable D1 and R2 save, restart, restore and failure handling
        run: node scripts/check-storage.mjs
      - name: Verify persisted recovery bundle, isolated restore and read-only storage inventory
        run: node scripts/check-recovery.mjs
      - name: Verify authenticated document tool and binary transfer contracts
        run: node scripts/check-host.mjs
      - name: Verify text rejection guidance and exact multi-paragraph cell editing
        run: node scripts/check-edit-text.mjs
      - name: Verify bounded mixed style replacements preserve raw anchors and stored versions
        run: node scripts/check-mixed-style.mjs
      - name: Verify language font selection preserves all definitions and stored versions
        run: node scripts/check-language-font.mjs
      - name: Verify uniform raw style proofs preserve large synthetic stored versions
        run: node scripts/check-uniform-style.mjs
      - name: Verify adversarial owner isolation and non-disclosing errors
        run: node scripts/check-isolation.mjs
      - name: Verify transfer limits and synthetic cleanup under injected failures
        run: node scripts/check-host-failures.mjs
      - name: Verify explicit deletion and exact-request failure recovery
        run: node scripts/check-deletion.mjs
      - name: Verify reads and saves overlapping explicit deletion
        run: node scripts/check-deletion-races.mjs
      - name: Verify pinned synthetic file transfer and embedded HWP result
        run: node scripts/check-synthetic-transfer.mjs
      - name: Verify fixed authenticated browser download contract without storage
        run: node scripts/check-synthetic-download.mjs
      - name: Verify stored-version viewer, passive previews and explicit synthetic seed
        run: node scripts/check-document-viewer.mjs
      - name: Verify browser upload gate, compiled client and lost acknowledgement retry
        run: node scripts/check-browser-upload.mjs
      - name: Verify stored document listing, owner isolation and bounded pagination
        run: node scripts/check-document-list.mjs
      - name: Verify full-size upload boundaries and synthetic measured workflows
        run: node scripts/check-performance-limits.mjs
      - name: Verify hosted workload refusals preserve documents and versions
        run: node scripts/check-hosted-workload.mjs
      - name: Verify parallel full reads, competing saves, replay and restore at hosted text boundary
        run: node scripts/check-concurrent-workload.mjs --memory
