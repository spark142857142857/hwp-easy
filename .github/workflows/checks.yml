name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install source test dependencies
        run: python -m pip install ".[mcp,pdf,hancom,native]" PyYAML
      - name: Set up pinned WASM host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact engine runtime without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test real HWP WASM engine without Hancom
        run: npm run test:engine
      - name: Install exact browser guard test dependencies
        working-directory: probes/sites-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare browser guard with independent Python reader and canonical checks
        run: node probes/sites-runtime/scripts/check-python-guard.mjs
      - name: Run regressions and real HWP MCP flows without Hancom
        env:
          HWP_EASY_NATIVE_TESTS: '1'
          HWP_EASY_RUNTIME_DIR: ${{ github.workspace }}
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Check explicit-only skill policy
        run: python -c "import pathlib,yaml; p=pathlib.Path('.agents/skills/one-hwp/agents/openai.yaml'); assert yaml.safe_load(p.read_text(encoding='utf-8'))['policy']['allow_implicit_invocation'] is False"
      - name: Build Python package only
        run: python -m pip wheel --no-deps --wheel-dir dist .

  worker-runtime:
    name: Synthetic Worker / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: probes/sites-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Worker test host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact synthetic probe dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify independent byte record and container guards
        run: node --test tests/*.test.mjs
      - name: Build precompiled WASM module artifact
        run: node scripts/build.mjs
      - name: Verify synthetic HWP in actual workerd without Hancom
        run: node scripts/check-workerd.mjs
      - name: Verify durable D1 and R2 save, restart, restore and failure handling
        run: node scripts/check-storage.mjs
